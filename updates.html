---
---
<head>
    <title>Updates &#8211; DerekYT (beta)</title>
    <link rel="icon" type="image/png" href="/assets/20260831-betafavicon.png">
<!-- Font information (start) -->
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<!-- Font information (end) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="preload" as="image" href="https://derekyt.dev/assets/20260613-webimage-dark.png" media="(prefers-color-scheme: dark)">
<link rel="preload" as="image" href="https://derekyt.dev/assets/20260626-webimage-light-6.png" media="(prefers-color-scheme: light)">
    <style>
        button, input, select, textarea {
            font-family: inherit;
        }

        body {
            background-attachment: fixed;
            background-size:cover;
            font-family: "Inter", sans-serif;
            text-align:left;
            max-width:750px;
            margin:0 auto;
            padding-top:30px;
            padding-bottom:30px;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        b {
            font-weight:550;
        }

        h1 {
            font-weight:550;
            letter-spacing:-0.5px;
        }

        h2 {
            margin-top:5px;
            margin-bottom:5px;
            font-weight:550;
            letter-spacing:-0.5px;
        }

        h3 {
            font-weight:550;
            letter-spacing:-0.5px;
        }

        nav {
            display: flex;
            justify-content:space-between;
            font-size:14px;
            letter-spacing:0em;
        }

        @media (max-width:600px) {
            body {
                padding-left:15px;
                padding-right:15px;
            }
            nav {
                font-size:14px;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-image: url('assets/20260626-webimage-light-6.png');
                color: #000000;
            }

            a:link, a:visited {
                color: #000000;
            }

            .nav-links a {
                color: #000000;
            }
            .nav-brand {
                color: #000000;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-image: url('assets/20260613-webimage-dark.png');
                background-color: #0c0e11;
                color: #ffffff;
            }
            a:link, a:visited {
                color: #ffffff;
            }
            .nav-links a {
                color: #ffffff;
            }
            .nav-brand {
                color: #ffffff;
            }
        }

        .nav-links {
            display: flex;
            gap:10px;
        }

        .nav-links a {
            opacity:0.5;
            text-decoration:none;
        }

        .nav-links a:link {
            opacity:0.5;
        }

        .nav-links a:hover {
            opacity:0.75;
        }

        .nav-links a:visited {
            opacity:0.5;
        }

        .nav-brand {
            font-weight:500;
        }

        .beta-label-style {
            background-color: rgba(255, 237, 118, 0.5);
            margin-top: 20px;
            padding:14px;
            font-size:15px;
            line-height:1.4;
            letter-spacing:0.01em;
            border-radius: 7px;
        }

        .deprecation-label-style {
            background-color: rgba(172, 7, 7, 0.5);
            margin-top: 10px;
            padding:14px;
            font-size:15px;
            line-height:1.4;
            letter-spacing:0em;
            border-radius: 7px;
        }

        .deprecation-label-text-main {
            font-size:15px;
            margin: 0 auto;
        }

        .welcome-font {
            margin-top:25px;
            margin-bottom:20px;
            font-size:36px;
            font-weight:500;
            letter-spacing:-0.5px;
        }

        .heading-body-line-height {
            margin-top:5px;
            margin-bottom:10px;
            line-height:25px;
        }

        .ver-head-font {
            display:inline-flex;
            align-items:center;
            gap:10px;
            margin:0px;
            letter-spacing:-0.25px;
            font-weight:500;
        }

        img {
            border-radius: 7px;
            width: 150px;
            height: 150px;
        }

        hr {
            margin-top:20px;
            margin-bottom:20px;
            width:100%;
        }

        a:link {
            opacity:0.83;
        }

        a:hover {
            opacity:0.67;
        }

        a:visited {
            opacity:0.5;
        }

        a.link-underline {
            text-decoration:none;
        }

        .update-metadata {
            margin-top:5px;
            margin-bottom:0px;
            font-size:11px;
            opacity:0.5;
            letter-spacing:0.25px;
        }

        footer {
            font-size:10px;
            letter-spacing:0.25px;
            opacity:0.5;
            margin-top: auto;
        }
    </style>
</head>
</style>
<body>
    <header>
    {% include site-header.html %}
    <div class="beta-label-style">This website is in beta. Some elements may not work properly.</div>
   <div class="deprecation-label-style">
        <p class="deprecation-label-text-main">This page will be deprecated soon.</p>
        <p class="update-metadata" data-utc="2026-07-28T22:33Z">Jul 28, 2026 at 22:33 UTC</p>
    </div>
    </header>
    <h1 class="welcome-font">Updates</h1>
    <p class="heading-body-line-height">Upcoming changes to this website will be shared here first.</p>

{% include site-footer.html %}
<script>
    document.querySelectorAll('[data-utc]').forEach(el => {
    const date = new Date(el.dataset.utc);
    el.textContent = "" + date.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
        timeZoneName: 'short'
    });
});
</script>
</body>
