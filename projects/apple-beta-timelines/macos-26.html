<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS 26 &#8211; Apple beta timelines</title>
    <link rel="icon" type="image/png" href="/assets/20260831-betafavicon.png">
    <link rel="stylesheet" href="../../assets/style-sheets/apple-beta-timelines-glass.css">
    <style>
         @media (max-width:600px) and (prefers-color-scheme: light) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-26-wallpaper-light-mobile.png');
            }
        }

        @media (min-width:601px) and (prefers-color-scheme: light) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-26-wallpaper-light-desktop.png');
            }
        }

        @media (max-width:600px) and (prefers-color-scheme: dark) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-26-wallpaper-dark-mobile.png');
            }
        }

        @media (min-width:601px) and (prefers-color-scheme: dark) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-26-wallpaper-dark-desktop.png');
            }
        }
    </style>
</head>
<body>
    {% include site-header.html %}

    <main>
        <h1>macOS 26</h1>
        <p class="timeline-picker-note">macOS 26 also known as macOS Tahoe</p>
        <label class="version-picker" for="software-version">
            <span>
                <select id="software-version" aria-label="Choose a macOS 26 version">
                    <option value="26-0">macOS 26.0</option>
                    <option value="26-1">macOS 26.1</option>
                    <option value="26-2">macOS 26.2</option>
                    <option value="26-3">macOS 26.3</option>
                    <option value="26-4">macOS 26.4</option>
                    <option value="26-5">macOS 26.5</option>
                    <option value="26-6">macOS 26.6</option>
                    <option value="26-7-x">macOS 26.7.x</option>
                </select>
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M3 5.5 8 10.5l5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
        </label>

        <section id="release-grid" class="release-grid" aria-live="polite"></section>
    </main>
    <footer id="timeline-footnote" class="timeline-footnote" hidden></footer>
    <footer hidden class="timeline-credit">
        Designed by <a href="https://x.com/derekyt_" target="_blank">@derekyt_</a> on X. Release info from <a href="https://appledb.dev" target="_blank">appledb.dev</a>, used under license.
    </footer>
    <script src="/assets/scripts/apple-beta-timelines.js" defer></script>
</body>
</html>
