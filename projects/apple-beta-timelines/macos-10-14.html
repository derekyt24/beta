<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS 10.14 &#8211; Apple beta timelines</title>
    <link rel="icon" type="image/png" href="/assets/20260831-betafavicon.png">
    <link rel="stylesheet" href="../../assets/style-sheets/apple-beta-timelines.css">
    <style>
        @media (max-width: 600px) and (prefers-color-scheme: light) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-10-14-wallpaper-light-mobile.png');
            }
        }

        @media (min-width: 601px) and (prefers-color-scheme: light) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-10-14-wallpaper-light-desktop.png');
            }
        }

        @media (max-width: 600px) and (prefers-color-scheme: dark) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-10-14-wallpaper-dark-mobile.png');
            }
        }

        @media (min-width: 601px) and (prefers-color-scheme: dark) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-macos-10-14-wallpaper-dark-desktop.png')
            }
        }
    </style>
</head>
<body>
    {% include site-header.html %}

    <main>
        <h1>macOS 10.14</h1>
        <p id="timeline-picker-note" class="timeline-picker-note">macOS 10.14 also known as macOS Mojave</p>
        <label class="version-picker" for="software-version">
            <span>
                <select id="software-version" aria-label="Choose a macOS 10.14 version">
                    <option value="10-14">macOS 10.14</option>
                    <option value="10-14-1">macOS 10.14.1</option>
                    <option value="10-14-2">macOS 10.14.2</option>
                    <option value="10-14-3">macOS 10.14.3</option>
                    <option value="10-14-4">macOS 10.14.4</option>
                    <option value="10-14-5">macOS 10.14.5</option>
                    <option value="10-14-6">macOS 10.14.6</option>
                </select>
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M3 5.5 8 10.5l5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
        </label>
        <section id="release-grid" class="release-grid" aria-live="polite"></section>
        <p id="timeline-intro-mac" class="timeline-intro-mac" hidden></p>
    </main>
    <footer id="timeline-footnote" class="timeline-footnote" hidden></footer>
    <script src="/assets/scripts/apple-beta-timelines.js" defer></script>
</body>
</html>
