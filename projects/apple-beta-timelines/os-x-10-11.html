<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS X 10.11 &#8211; Apple beta timelines</title>
    <link rel="icon" type="image/png" href="/assets/20260831-betafavicon.png">
    <link rel="stylesheet" href="../../assets/style-sheets/apple-beta-timelines.css">
    <style>
        @media (max-width:600px) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-os-x-10-11-wallpaper-mobile.png');
            }
        }

        @media (min-width:601px) {
            body {
                background-image:url('https://beta.derekyt.dev/assets/bg-images/apple-beta-timelines-os-x-10-11-wallpaper-desktop.png');
            }
        }
    </style>
</head>
<body>
    {% include site-header.html %}

    <main>
        <h1>OS X 10.11</h1>
        <p id="timeline-picker-note" class="timeline-picker-note">OS X 10.11 also known as OS X El Capitan</p>
        <label class="version-picker" for="software-version">
            <span>
                <select id="software-version" aria-label="Choose an OS X 10.11 version">
                    <option value="10-11">OS X 10.11</option>
                    <option value="10-11-1">OS X 10.11.1</option>
                    <option value="10-11-2">OS X 10.11.2</option>
                    <option value="10-11-3">OS X 10.11.3</option>
                    <option value="10-11-4">OS X 10.11.4</option>
                    <option value="10-11-5">OS X 10.11.5</option>
                    <option value="10-11-6">OS X 10.11.6</option>
                </select>
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M3 5.5 8 10.5l5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
        </label>

        <section id="release-grid" class="release-grid" aria-live="polite"></section>
    </main>
    <footer id="timeline-footnote" class="timeline-footnote" hidden></footer>
    <script src="/assets/scripts/apple-beta-timelines.js" defer></script>
</body>
</html>
